<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TORINOX バーチャル試着デモ</title>
<style>
  :root { --bg:#0e0f12; --panel:#1a1c22; --accent:#4da3ff; --text:#eef1f5; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:"Hiragino Sans","Noto Sans JP",sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { padding:14px 20px 6px; text-align:center; }
  header h1 { font-size:18px; font-weight:700; letter-spacing:.06em; }
  header p { font-size:12px; color:#9aa3b2; margin-top:4px; }
  #stage { position:relative; width:min(92vw,760px); aspect-ratio:4/3; background:#000; border-radius:14px; overflow:hidden; margin-top:10px; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  #video, #three { position:absolute; inset:0; width:100%; height:100%; }
  #video { object-fit:cover; transform:scaleX(-1); }
  #three { transform:scaleX(-1); }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; font-size:14px; color:#cdd5e0; padding:20px; background:rgba(0,0,0,.55); }
  .controls { width:min(92vw,760px); background:var(--panel); border-radius:14px; margin:12px 0 30px; padding:14px 18px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:8px 0; }
  .row label { font-size:13px; color:#aeb7c6; min-width:7em; }
  .models button { background:#2a2e38; color:var(--text); border:1px solid #3a4050; border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; }
  .models button.active { background:var(--accent); border-color:var(--accent); color:#08121f; font-weight:700; }
  input[type=range] { flex:1; accent-color:var(--accent); }
  .val { font-size:12px; color:#8f98a8; width:3.5em; text-align:right; }
  footer { font-size:11px; color:#6b7484; padding-bottom:20px; }
</style>
</head>
<body>
<header>
  <h1>TORINOX バーチャル試着デモ</h1>
  <p>カメラに顔を映すとサングラスが追従します（データは端末内で処理・外部送信なし）</p>
</header>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="three"></canvas>
  <div id="msg">読み込み中…</div>
</div>

<div class="controls">
  <div class="row models">
    <label>モデル</label>
    <button data-m="model_a.glb" class="active">新型 A（166/266）</button>
    <button data-m="model_b.glb">新型 B（166/266）</button>
    <button data-m="arq.glb">ARQ（スキャン）</button>
  </div>
  <div class="row"><label>レンズ透過</label><input id="lensOp" type="range" min="5" max="100" value="45"><span class="val" id="lensOpV">45%</span></div>
  <div class="row"><label>大きさ</label><input id="fitS" type="range" min="80" max="120" value="100"><span class="val" id="fitSV">100%</span></div>
  <div class="row"><label>上下位置</label><input id="fitY" type="range" min="-30" max="60" value="18"><span class="val" id="fitYV"></span></div>
  <div class="row"><label>前後位置</label><input id="fitZ" type="range" min="0" max="90" value="45"><span class="val" id="fitZV"></span></div>
</div>
<footer>TORINOX × 合同会社ヤシノミ — 技術デモ（非公開・関係者限り）</footer>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { FilesetResolver, FaceLandmarker } from 'https://unpkg.com/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const msg = document.getElementById('msg');
const video = document.getElementById('video');
const canvas = document.getElementById('three');

// --- three.js セットアップ ---
const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(63, 4/3, 1, 10000);
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dir = new THREE.DirectionalLight(0xffffff, 1.2); dir.position.set(0.5,1,2); scene.add(dir);

const anchor = new THREE.Group();      // 顔の変換行列を適用
anchor.matrixAutoUpdate = false;
scene.add(anchor);
const fit = new THREE.Group();         // 手動フィット(スケール/オフセット)
anchor.add(fit);

let glasses = null, lensMats = [];
const loader = new GLTFLoader();
function loadModel(file){
  msg.style.display='flex'; msg.textContent='モデル読み込み中…';
  loader.load(file, g => {
    if (glasses) fit.remove(glasses);
    glasses = g.scene; lensMats = [];
    glasses.traverse(o => {
      if (o.isMesh) {
        o.frustumCulled = false;
        const ms = Array.isArray(o.material) ? o.material : [o.material];
        ms.forEach(m => {
          if (/lens/i.test(m.name)) { m.transparent = true; lensMats.push(m); }
        });
      }
    });
    glasses.scale.setScalar(100); // m → cm（MediaPipe顔空間はcm）
    fit.add(glasses);
    applyLens(); msg.style.display='none';
  }, undefined, e => { msg.textContent = 'モデル読み込み失敗: '+file; });
}

// --- UI ---
const $=id=>document.getElementById(id);
function applyLens(){ const v=+$('lensOp').value; $('lensOpV').textContent=v+'%'; lensMats.forEach(m=>m.opacity=v/100); }
function applyFit(){
  const s=+$('fitS').value/100, y=+$('fitY').value/10, z=+$('fitZ').value/10;
  $('fitSV').textContent=Math.round(s*100)+'%'; $('fitYV').textContent=y.toFixed(1)+'cm'; $('fitZV').textContent=z.toFixed(1)+'cm';
  fit.scale.setScalar(s); fit.position.set(0,y,z);
}
$('lensOp').oninput=applyLens;
['fitS','fitY','fitZ'].forEach(id=>$(id).oninput=applyFit);
document.querySelectorAll('.models button').forEach(b=>{
  b.onclick=()=>{ document.querySelectorAll('.models button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); loadModel(b.dataset.m); };
});
applyFit();
loadModel('model_a.glb');

// --- MediaPipe FaceLandmarker ---
let landmarker=null, running=false;
async function start(){
  try {
    msg.textContent='顔認識モデル読み込み中…';
    const vision = await FilesetResolver.forVisionTasks('https://unpkg.com/@mediapipe/tasks-vision@0.10.14/wasm');
    landmarker = await FaceLandmarker.createFromOptions(vision, {
      baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate:'GPU' },
      runningMode:'VIDEO', numFaces:1, outputFacialTransformationMatrixes:true });
    msg.textContent='カメラ起動中…';
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ width:960, height:720, facingMode:'user' } });
    video.srcObject = stream;
    await new Promise(r=>video.onloadedmetadata=r);
    resize(); running=true; msg.style.display='none';
    requestAnimationFrame(loop);
  } catch(e) {
    msg.innerHTML = 'カメラを利用できません（'+e.name+'）。<br>ブラウザのカメラ許可を確認してください。<br><br>参考表示モードで回転表示します。';
    demoMode();
  }
}
function resize(){
  const w = video.videoWidth||960, h = video.videoHeight||720;
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  camera.aspect = canvas.clientWidth/canvas.clientHeight;
  // MediaPipeの顔空間(cm)に合わせた擬似FOV
  camera.fov = 63; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const faceMatrix = new THREE.Matrix4();
let lastVideoTime = -1;
function loop(){
  if (!running) return;
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    if (res.facialTransformationMatrixes && res.facialTransformationMatrixes.length) {
      faceMatrix.fromArray(res.facialTransformationMatrixes[0].data);
      anchor.matrix.copy(faceMatrix);
      anchor.visible = true;
    } else {
      anchor.visible = false;
    }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// カメラ不可時: 回転ターンテーブル表示
function demoMode(){
  anchor.matrix.identity(); anchor.visible = true;
  anchor.matrix.setPosition(0, 0, -25);
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
  camera.aspect = canvas.clientWidth/canvas.clientHeight; camera.updateProjectionMatrix();
  let t=0;
  (function spin(){ t+=0.01;
    const m = new THREE.Matrix4().makeRotationY(t); m.setPosition(0,0,-25);
    anchor.matrix.copy(m);
    renderer.render(scene,camera); requestAnimationFrame(spin); })();
}
start();
</script>
</body>
</html>
