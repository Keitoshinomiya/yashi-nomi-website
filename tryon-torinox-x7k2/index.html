<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TORINOX バーチャル試着デモ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Orbitron:wght@500;700;900&display=swap');
  :root { --bg:#000000; --panel:#0b0b0b; --line:#2a2a2a; --accent:#B48250; --text:#ffffff; --sub:#a4a4a4;
          --orbitron:"Orbitron","Noto Sans JP",sans-serif; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:"Noto Sans JP","Hiragino Sans",sans-serif; font-weight:500;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding-bottom:36px; }
  header { padding:22px 20px 4px; text-align:center; }
  header h1 { font-family:var(--orbitron); font-size:24px; font-weight:900; letter-spacing:.22em; text-indent:.22em; }
  header .en { font-family:var(--orbitron); font-size:10px; font-weight:700; letter-spacing:.42em; text-indent:.42em;
               color:var(--accent); margin-top:6px; }
  header p { font-size:11px; color:var(--sub); margin-top:8px; line-height:1.7; font-weight:400; }
  #stage { position:relative; width:min(94vw,720px); aspect-ratio:4/3;
           background:radial-gradient(circle at 50% 42%, #1c1d1f 0%, #050505 72%);
           border:1px solid var(--line); overflow:hidden; margin-top:14px; }
  #video { display:none; }
  #three { position:absolute; inset:0; width:100%; height:100%; transform:scaleX(-1); }
  #three.nomirror { transform:none; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
         font-size:13px; color:#d5d5d5; padding:24px; background:rgba(0,0,0,.66); line-height:1.9; font-weight:400; }
  .panel { width:min(94vw,720px); background:var(--panel); border:1px solid var(--line);
           margin-top:14px; padding:18px 20px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0; }
  .row > label { font-size:11px; color:var(--sub); min-width:6.4em; letter-spacing:.14em; font-weight:700; }
  button { transition:.25s; }
  .chips button { background:#000; color:var(--text); border:1px solid #ffffff; border-radius:0;
                  padding:8px 16px; font-size:12px; cursor:pointer; font-family:var(--orbitron); font-weight:700; letter-spacing:.08em; }
  .chips button:hover { opacity:.6; }
  .chips button.active { background:var(--accent); border-color:var(--accent); color:#000; }
  .sw button { width:36px; height:36px; border-radius:50%; border:1px solid #3d3d3d; cursor:pointer; padding:0;
               box-shadow:inset 0 0 0 2px #000; }
  .sw button:hover { opacity:.75; }
  .sw button.active { border-color:var(--accent); box-shadow:inset 0 0 0 2px #000, 0 0 0 2px var(--accent); }
  .pcbtn { background:#000; color:var(--text); border:1px solid #ffffff; border-radius:0;
           padding:6px 13px; font-size:11.5px; cursor:pointer; font-weight:500; letter-spacing:.06em; }
  .pcbtn:hover { opacity:.6; }
  .pcbtn.active { background:var(--accent); border-color:var(--accent); color:#000; font-weight:700; }
  input[type=range] { flex:1; min-width:150px; accent-color:var(--accent); }
  .val { font-family:var(--orbitron); font-weight:500; font-size:11px; color:var(--sub); width:4.6em; text-align:right; letter-spacing:.04em; }
  #mirNote { width:auto; font-family:"Noto Sans JP",sans-serif; font-weight:400; font-size:10.5px; letter-spacing:0; text-align:left; }
  #pcNote { width:auto; }
  .act { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .act button { background:#000; color:var(--text); border:1px solid #ffffff; border-radius:0;
                padding:10px 18px; font-size:12.5px; cursor:pointer; letter-spacing:.1em; font-weight:700; }
  .act button:hover { opacity:.6; }
  .act button.primary { background:var(--accent); border-color:var(--accent); color:#000; }
  footer { font-size:10px; color:#6b6b6b; margin-top:18px; text-align:center; line-height:1.8; font-weight:400; }
</style>
</head>
<body>
<header>
  <h1>TORINOX</h1>
  <div class="en">VIRTUAL TRY-ON</div>
  <p>カメラに顔を映すとサングラスが装着されます。映像は端末内だけで処理し、外部には一切送信しません。</p>
</header>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="three"></canvas>
  <div id="msg">読み込み中…</div>
</div>

<div class="panel">
  <div class="row chips" id="models">
    <label>モデル</label>
    <button data-m="glasses_A.glb?v=20260903" class="active">ARQ（角型）</button>
    <button data-m="glasses_C.glb?v=20260903">MOTION（角型）</button>
  </div>
  <div class="row"><label>レンズ透過率</label><input id="op" type="range" min="3" max="70" value="8"><span class="val" id="opV">8%</span></div>
  <div class="row">
    <label>調光レンズ</label>
    <button id="pcOff" class="pcbtn active">なし</button>
    <button id="pcIn" class="pcbtn">屋内</button>
    <button id="pcOut" class="pcbtn">屋外</button>
    <span class="val" id="pcNote"></span>
  </div>
  <div class="row">
    <label>画面の向き</label>
    <button id="mirOn" class="pcbtn">鏡のように</button>
    <button id="mirOff" class="pcbtn active">実物どおり</button>
    <span class="val" id="mirNote">実物どおりの向き（ロゴが読めます）</span>
  </div>
  <div class="row">
    <label>点検</label>
    <button id="occOn" class="pcbtn active">顔の隠しあり</button>
    <button id="occOff" class="pcbtn">顔の隠しなし</button>
    <button id="dsOff" class="pcbtn active">片面描画</button>
    <button id="dsOn" class="pcbtn">両面描画</button>
  </div>
  <div class="row"><label>傾き</label><input id="tl" type="range" min="-20" max="20" value="0"><span class="val" id="tlV">0°</span></div>
  <div class="row"><label>サイズ</label><input id="sc" type="range" min="85" max="115" value="100"><span class="val" id="scV">100%</span></div>
  <div class="row"><label>上下</label><input id="oy" type="range" min="-15" max="15" value="0"><span class="val" id="oyV">0.0mm</span></div>
  <div class="row"><label>前後</label><input id="oz" type="range" min="-10" max="20" value="0"><span class="val" id="ozV">0.0mm</span></div>
  <div class="act">
    <button id="shot" class="primary">写真を保存</button>
    <button id="export">設定を書き出す</button>
    <button id="reset">位置をリセット</button>
  </div>
</div>
<footer>
  Amazon 3D要件準拠（GLB／ノード分割／KHR_materials_transmission／glTF-Validator エラー0・警告0）<br>
  TORINOX &times; 合同会社ヤシノミ ― 技術デモ（非公開・関係者限り）<br>
  <span style="opacity:.55">モデル版: 2026-09-03a（ARQ 面向き修正／MOTION 球面レンズ）</span>
</footer>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { FilesetResolver, FaceLandmarker } from 'https://unpkg.com/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const $ = id => document.getElementById(id);
const msg = $('msg'), video = $('video'), canvas = $('three');

/* 標準顔モデル(MediaPipe canonical face, cm)上で検証した装着位置 */
const BASE_POS = { y: 2.05, z: 5.50 };
/* レンズ色 = 実製品写真から実測した「色相」を明るさ1.0に正規化したリニアRGB。
   実際の濃さは下のVLT（可視光線透過率）スライダーで決める。 */
const LENS_COLORS = [
  { name:'ブラック', tint:[1.00, 1.00, 1.03], vlt:8 },   // 受注仕様: ブラックレンズのみ
];
/* 調光レンズの演出用（実物は屋外で約60秒かけて濃くなる） */
const PHOTO = { indoor:55, outdoor:10, ms:2500 };

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;   // レンズ色を忠実に出すため

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(63, 4/3, 1, 5000);   // MediaPipe計量空間に合わせる
scene.add(new THREE.AmbientLight(0xffffff, 0.30));
const key = new THREE.DirectionalLight(0xffffff, 0.8); key.position.set(0.4, 0.8, 2); scene.add(key);

const anchor = new THREE.Group();
anchor.matrixAutoUpdate = false;
anchor.visible = false;
scene.add(anchor);
const fit = new THREE.Group();
anchor.add(fit);

const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(draco);

/* 顔オクルーダー：色を描かず深度だけ書き、顔の裏のテンプルを隠す */
loader.load('face_occluder.glb?v=20260903', g => {
  const occ = g.scene;
  occ.traverse(o => {
    if (o.isMesh) {
      o.material = new THREE.MeshBasicMaterial({ colorWrite:false });
      o.renderOrder = -10; o.frustumCulled = false;
    }
  });
  occ.scale.setScalar(100);
  anchor.add(occ); occRoot = occ;
});

let glasses = null, occRoot = null, doubleSided = false;
const lensMats = [];
let curLens = LENS_COLORS[0];

function loadModel(file){
  msg.style.display = 'flex'; msg.textContent = 'モデル読み込み中…';
  loader.load(file, g => {
    if (glasses) fit.remove(glasses);
    glasses = g.scene; lensMats.length = 0;
    glasses.traverse(o => {
      if (!o.isMesh) return;
      o.frustumCulled = false;
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(m => {
        const n = m.name || '';
        if (n === 'LensMat') {
          if (!lensMats.includes(m)) lensMats.push(m);
          // レンズ縁やブリッジに白い筋が出るのを防ぐ（環境反射を落とし裏面を描かない）
          m.envMapIntensity = 0.05;
          m.roughness = 0.20;
          m.side = THREE.FrontSide;
          o.renderOrder = 2;
        } else if (n === 'AccentMat') {
          m.envMapIntensity = 0.45;      // サテン仕上げ。白飛びを抑える
          o.renderOrder = 1; m.side = doubleSided ? THREE.DoubleSide : THREE.FrontSide;
        } else {
          m.envMapIntensity = 0.30;
          o.renderOrder = 1; m.side = doubleSided ? THREE.DoubleSide : THREE.FrontSide;
        }
      });
    });
    glasses.scale.setScalar(100);   // m → cm
    fit.add(glasses);
    applyLens(); applyFit();
    msg.style.display = 'none';
  }, undefined, () => { msg.textContent = 'モデル読み込みに失敗しました: ' + file; });
}


/* ---- 調光レンズの演出（実物は屋外で約60秒かけて変化） ---- */
let photoMode = null, animId = null;
function markPC(id){
  ['pcOff','pcIn','pcOut'].forEach(k => $(k).classList.toggle('active', k === id));
}
function animateVLT(from, to){
  if (animId) cancelAnimationFrame(animId);
  const t0 = performance.now();
  (function step(now){
    const k = Math.min(1, (now - t0) / PHOTO.ms);
    const e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;   // ease-in-out
    setLensVLT(from + (to - from) * e);
    if (k < 1) animId = requestAnimationFrame(step);
  })(t0);
}
$('pcOff').onclick = () => { photoMode = null; markPC('pcOff'); $('pcNote').textContent=''; setLensVLT(curLens.vlt); };
$('pcIn').onclick  = () => {
  const from = photoMode === 'out' ? PHOTO.outdoor : +$('opV').textContent.replace('%','');
  photoMode = 'in'; markPC('pcIn'); $('pcNote').textContent = PHOTO.indoor + '%';
  animateVLT(from, PHOTO.indoor);
};
$('pcOut').onclick = () => {
  const from = photoMode === 'in' ? PHOTO.indoor : +$('opV').textContent.replace('%','');
  photoMode = 'out'; markPC('pcOut'); $('pcNote').textContent = PHOTO.outdoor + '%';
  animateVLT(from, PHOTO.outdoor);
};

/* ---- 設定の書き出し（TORINOX側で決めた値をそのまま共有できるように） ---- */
$('export').onclick = () => {
  const model = $('models').querySelector('button.active').textContent.trim();
  const lines = ['TORINOX バーチャル試着デモ — レンズ設定', '対象モデル: ' + model, ''];
  LENS_COLORS.forEach(c => lines.push(`${c.name}　VLT ${c.vlt}%`));
  lines.push('', `フィット調整: 傾き ${$('tl').value}° / サイズ ${$('sc').value}% / 上下 ${$('oy').value}mm / 前後 ${$('oz').value}mm`);
  lines.push(`調光レンズ演出: 屋内 ${PHOTO.indoor}% / 屋外 ${PHOTO.outdoor}%`);
  const txt = lines.join('\n');
  navigator.clipboard.writeText(txt)
    .then(() => alert('設定をコピーしました。\n\n' + txt))
    .catch(() => alert(txt));
};

function setLensVLT(pct){
  const vlt = pct / 100;
  $('opV').textContent = Math.round(pct) + '%';
  const t = curLens.tint;
  lensMats.forEach(m => {
    // 透過光 = 背景 × color。色相はtint、明るさはVLTで決まる（リニア空間で指定）
    m.color.setRGB(t[0]*vlt, t[1]*vlt, t[2]*vlt);
    m.transmission = 1.0;
    m.needsUpdate = true;
  });
}
function applyLens(){
  const pct = +$('op').value;
  curLens.vlt = pct;                 // 色ごとに設定を記憶
  photoMode = null; markPC('pcOff');
  setLensVLT(pct);
}
function applyFit(){
  const s = +$('sc').value / 100, oy = +$('oy').value, oz = +$('oz').value, tl = +$('tl').value;
  $('scV').textContent = Math.round(s*100) + '%';
  $('oyV').textContent = oy.toFixed(1) + 'mm';
  $('ozV').textContent = oz.toFixed(1) + 'mm';
  $('tlV').textContent = tl + '°';
  fit.scale.setScalar(s);
  fit.position.set(0, BASE_POS.y + oy/10, BASE_POS.z + oz/10);
  fit.rotation.x = tl * Math.PI / 180;     // 前傾角（つるの高さが変わる）
}
$('op').oninput = applyLens;
['sc','oy','oz','tl'].forEach(id => $(id).oninput = applyFit);
$('reset').onclick = () => { $('sc').value=100; $('oy').value=0; $('oz').value=0; $('tl').value=0; applyFit(); };
$('models').querySelectorAll('button').forEach(b => {
  b.onclick = () => {
    $('models').querySelectorAll('button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); loadModel(b.dataset.m);
  };
});

/* 点検用: 顔の隠し(オクルーダー)と両面描画の切替。穴の原因切り分けに使う */
function applyInspect(){
  if (occRoot) occRoot.visible = !$('occOff').classList.contains('active');
  if (glasses) glasses.traverse(o => {
    if (!o.isMesh) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
      if ((m.name || '') === 'LensMat') return;
      m.side = doubleSided ? THREE.DoubleSide : THREE.FrontSide; m.needsUpdate = true;
    });
  });
}
$('occOn').onclick  = () => { $('occOn').classList.add('active');  $('occOff').classList.remove('active'); applyInspect(); };
$('occOff').onclick = () => { $('occOff').classList.add('active'); $('occOn').classList.remove('active');  applyInspect(); };
$('dsOff').onclick  = () => { doubleSided = false; $('dsOff').classList.add('active'); $('dsOn').classList.remove('active');  applyInspect(); };
$('dsOn').onclick   = () => { doubleSided = true;  $('dsOn').classList.add('active');  $('dsOff').classList.remove('active'); applyInspect(); };

/* 表示の左右反転：試着は鏡向きが自然だが、テンプルのロゴを読むときは実物どおりに切り替える */
let mirrored = false;   // 既定は実物どおり（ロゴが正しく読める向き）
function applyMirror(){
  canvas.classList.toggle('nomirror', !mirrored);
  $('mirOn').classList.toggle('active', mirrored);
  $('mirOff').classList.toggle('active', !mirrored);
  $('mirNote').textContent = mirrored
    ? '鏡と同じ向き（ロゴは左右反転して見えます）'
    : '実物どおりの向き（ロゴが読めます）';
}
$('mirOn').onclick  = () => { mirrored = true;  applyMirror(); };
$('mirOff').onclick = () => { mirrored = false; applyMirror(); };
applyMirror();

/* 写真保存：canvasの向きは表示設定に合わせる */
$('shot').onclick = () => {
  const w = canvas.width, h = canvas.height;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  if (mirrored) { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(canvas, 0, 0);
  const a = document.createElement('a');
  a.download = 'torinox-tryon.png';
  a.href = c.toDataURL('image/png');
  a.click();
};

applyFit();
loadModel('glasses_A.glb?v=20260903');

let landmarker = null, running = false, lastT = -1;
const faceMat = new THREE.Matrix4();

function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

async function start(){
  try {
    msg.textContent = '顔認識モデルを読み込み中…';
    const vision = await FilesetResolver.forVisionTasks('https://unpkg.com/@mediapipe/tasks-vision@0.10.14/wasm');
    landmarker = await FaceLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate:'GPU' },
      runningMode:'VIDEO', numFaces:1, outputFacialTransformationMatrixes:true });
    msg.textContent = 'カメラを起動中…（許可ダイアログで「許可」を選んでください）';
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ width:{ideal:960}, height:{ideal:720}, facingMode:'user' } });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    await video.play();
    /* 映像を3Dシーンの背景にする → レンズのtransmissionが顔を透かす */
    const vt = new THREE.VideoTexture(video);
    vt.colorSpace = THREE.SRGBColorSpace;
    scene.background = vt;
    resize(); running = true; msg.style.display = 'none';
    requestAnimationFrame(loop);
  } catch(e) {
    msg.style.display = 'flex';
    msg.style.background = 'rgba(0,0,0,.35)';
    msg.style.alignItems = 'flex-end';
    msg.innerHTML = '<div style="width:100%">カメラを利用できませんでした（' + e.name + '）。ブラウザのカメラ許可をご確認ください。<br>いまは参考として3Dモデルを回転表示しています。</div>';
    demo();
  }
}

function loop(){
  if (!running) return;
  if (video.currentTime !== lastT) {
    lastT = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    const mats = res.facialTransformationMatrixes;
    if (mats && mats.length) {
      faceMat.fromArray(mats[0].data);
      anchor.matrix.copy(faceMat);
      anchor.visible = true;
    } else {
      anchor.visible = false;
    }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

function demo(){
  resize();
  anchor.visible = true;
  anchor.children.forEach(c => { if (c !== fit) c.visible = false; });
  let t = 0;
  (function spin(){
    t += 0.008;
    const m = new THREE.Matrix4().makeRotationY(t);
    m.setPosition(0, -2.5, -30);
    anchor.matrix.copy(m);
    renderer.render(scene, camera);
    requestAnimationFrame(spin);
  })();
}
start();
</script>
</body>
</html>
