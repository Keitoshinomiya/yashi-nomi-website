<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TORINOX バーチャル試着デモ</title>
<style>
  :root { --bg:#0d0e11; --panel:#181a20; --line:#2b2f3a; --accent:#4da3ff; --text:#eef1f5; --sub:#98a1b0; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding-bottom:32px; }
  header { padding:16px 20px 4px; text-align:center; }
  header h1 { font-size:17px; font-weight:700; letter-spacing:.08em; }
  header p { font-size:11.5px; color:var(--sub); margin-top:5px; line-height:1.6; }
  #stage { position:relative; width:min(94vw,720px); aspect-ratio:4/3;
           background:radial-gradient(circle at 50% 42%, #3a4150 0%, #15171d 70%);
           border-radius:14px; overflow:hidden; margin-top:12px; box-shadow:0 10px 34px rgba(0,0,0,.55); }
  #video { display:none; }
  #three { position:absolute; inset:0; width:100%; height:100%; transform:scaleX(-1); }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
         font-size:13.5px; color:#cdd5e0; padding:24px; background:rgba(0,0,0,.6); line-height:1.8; }
  .panel { width:min(94vw,720px); background:var(--panel); border:1px solid var(--line);
           border-radius:14px; margin-top:12px; padding:14px 18px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:9px 0; }
  .row > label { font-size:12.5px; color:var(--sub); min-width:6.2em; }
  .chips button { background:#252932; color:var(--text); border:1px solid #39404e; border-radius:8px;
                  padding:7px 14px; font-size:13px; cursor:pointer; }
  .chips button.active { background:var(--accent); border-color:var(--accent); color:#07131f; font-weight:700; }
  .sw button { width:34px; height:34px; border-radius:50%; border:2px solid #3a4150; cursor:pointer; padding:0; }
  .sw button.active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(77,163,255,.35); }
  input[type=range] { flex:1; min-width:150px; accent-color:var(--accent); }
  .val { font-size:11.5px; color:#8b94a4; width:4.2em; text-align:right; }
  .act { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .act button { background:#252932; color:var(--text); border:1px solid #39404e; border-radius:8px;
                padding:9px 16px; font-size:13px; cursor:pointer; }
  .act button.primary { background:var(--accent); border-color:var(--accent); color:#07131f; font-weight:700; }
  footer { font-size:10.5px; color:#5d6675; margin-top:16px; text-align:center; line-height:1.7; }
</style>
</head>
<body>
<header>
  <h1>TORINOX バーチャル試着デモ</h1>
  <p>カメラに顔を映すとサングラスが装着されます。映像は端末内だけで処理し、外部には一切送信しません。</p>
</header>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="three"></canvas>
  <div id="msg">読み込み中…</div>
</div>

<div class="panel">
  <div class="row chips" id="models">
    <label>モデル</label>
    <button data-m="glasses_A.glb" class="active">TORINOX A（スクエア）</button>
    <button data-m="glasses_B.glb">TORINOX B（ラウンド）</button>
  </div>
  <div class="row sw" id="lensCols">
    <label>レンズ色</label>
  </div>
  <div class="row"><label>レンズ濃度</label><input id="op" type="range" min="0" max="95" value="30"><span class="val" id="opV">30%</span></div>
  <div class="row"><label>サイズ</label><input id="sc" type="range" min="85" max="115" value="100"><span class="val" id="scV">100%</span></div>
  <div class="row"><label>上下</label><input id="oy" type="range" min="-15" max="15" value="0"><span class="val" id="oyV">0.0mm</span></div>
  <div class="row"><label>前後</label><input id="oz" type="range" min="-10" max="20" value="0"><span class="val" id="ozV">0.0mm</span></div>
  <div class="act">
    <button id="shot" class="primary">写真を保存</button>
    <button id="reset">位置をリセット</button>
  </div>
</div>
<footer>
  Amazon 3D要件準拠モデル（GLB / 三角形140,000 / 実寸148mm / ノード Frame・TempleR・TempleL・LensR・LensL / レンズ KHR_materials_transmission）<br>
  TORINOX × 合同会社ヤシノミ — 技術デモ（非公開・関係者限り）
</footer>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { FilesetResolver, FaceLandmarker } from 'https://unpkg.com/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const $ = id => document.getElementById(id);
const msg = $('msg'), video = $('video'), canvas = $('three');

/* 標準顔モデル(MediaPipe canonical face, cm)上で検証した装着位置 */
const BASE_POS = { y: 2.90, z: 5.50 };
/* Amazon実製品写真からピクセル実測したレンズ色 */
const LENS_COLORS = [
  { name:'スモーク', hex:0x5e6266 },
  { name:'オリーブ', hex:0x7e7b6c },
  { name:'ブルー',   hex:0x889aca },
];

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(63, 4/3, 1, 5000);   // MediaPipe計量空間に合わせる
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(0.4, 0.8, 2); scene.add(key);

const anchor = new THREE.Group();
anchor.matrixAutoUpdate = false;
anchor.visible = false;
scene.add(anchor);
const fit = new THREE.Group();
anchor.add(fit);

const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(draco);

/* 顔オクルーダー：色を描かず深度だけ書き、顔の裏のテンプルを隠す */
loader.load('face_occluder.glb', g => {
  const occ = g.scene;
  occ.traverse(o => {
    if (o.isMesh) {
      o.material = new THREE.MeshBasicMaterial({ colorWrite:false });
      o.renderOrder = -10; o.frustumCulled = false;
    }
  });
  occ.scale.setScalar(100);
  anchor.add(occ);
});

let glasses = null;
const lensMats = [];
let curLens = LENS_COLORS[0].hex;

function loadModel(file){
  msg.style.display = 'flex'; msg.textContent = 'モデル読み込み中…';
  loader.load(file, g => {
    if (glasses) fit.remove(glasses);
    glasses = g.scene; lensMats.length = 0;
    glasses.traverse(o => {
      if (!o.isMesh) return;
      o.frustumCulled = false;
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(m => {
        const isLens = /Lens/i.test(o.name) || /Lens/i.test(m.name || '');
        if (isLens) {
          lensMats.push(m);
          m.envMapIntensity = 0.35;
          o.renderOrder = 2;
        } else {
          m.envMapIntensity = 0.55;
          o.renderOrder = 1;
        }
      });
    });
    glasses.scale.setScalar(100);   // m → cm
    fit.add(glasses);
    applyLens(); applyFit();
    msg.style.display = 'none';
  }, undefined, () => { msg.textContent = 'モデル読み込みに失敗しました: ' + file; });
}

const swWrap = $('lensCols');
LENS_COLORS.forEach((c, i) => {
  const b = document.createElement('button');
  b.style.background = '#' + c.hex.toString(16).padStart(6,'0');
  b.title = c.name;
  if (i === 0) b.classList.add('active');
  b.onclick = () => {
    swWrap.querySelectorAll('button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); curLens = c.hex; applyLens();
  };
  swWrap.appendChild(b);
});

function applyLens(){
  const d = +$('op').value; $('opV').textContent = d + '%';
  lensMats.forEach(m => {
    m.color.setHex(curLens, THREE.SRGBColorSpace);
    m.transmission = 1 - d / 100;      // 濃度を上げるほど透過を下げる
  });
}
function applyFit(){
  const s = +$('sc').value / 100, oy = +$('oy').value, oz = +$('oz').value;
  $('scV').textContent = Math.round(s*100) + '%';
  $('oyV').textContent = oy.toFixed(1) + 'mm';
  $('ozV').textContent = oz.toFixed(1) + 'mm';
  fit.scale.setScalar(s);
  fit.position.set(0, BASE_POS.y + oy/10, BASE_POS.z + oz/10);
}
$('op').oninput = applyLens;
['sc','oy','oz'].forEach(id => $(id).oninput = applyFit);
$('reset').onclick = () => { $('sc').value=100; $('oy').value=0; $('oz').value=0; applyFit(); };
$('models').querySelectorAll('button').forEach(b => {
  b.onclick = () => {
    $('models').querySelectorAll('button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); loadModel(b.dataset.m);
  };
});

/* 写真保存：canvasに映像も3Dも入っているので左右反転して書き出す */
$('shot').onclick = () => {
  const w = canvas.width, h = canvas.height;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.translate(w, 0); ctx.scale(-1, 1);
  ctx.drawImage(canvas, 0, 0);
  const a = document.createElement('a');
  a.download = 'torinox-tryon.png';
  a.href = c.toDataURL('image/png');
  a.click();
};

applyFit();
loadModel('glasses_A.glb');

let landmarker = null, running = false, lastT = -1;
const faceMat = new THREE.Matrix4();

function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

async function start(){
  try {
    msg.textContent = '顔認識モデルを読み込み中…';
    const vision = await FilesetResolver.forVisionTasks('https://unpkg.com/@mediapipe/tasks-vision@0.10.14/wasm');
    landmarker = await FaceLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate:'GPU' },
      runningMode:'VIDEO', numFaces:1, outputFacialTransformationMatrixes:true });
    msg.textContent = 'カメラを起動中…（許可ダイアログで「許可」を選んでください）';
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ width:{ideal:960}, height:{ideal:720}, facingMode:'user' } });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    await video.play();
    /* 映像を3Dシーンの背景にする → レンズのtransmissionが顔を透かす */
    const vt = new THREE.VideoTexture(video);
    vt.colorSpace = THREE.SRGBColorSpace;
    scene.background = vt;
    resize(); running = true; msg.style.display = 'none';
    requestAnimationFrame(loop);
  } catch(e) {
    msg.style.display = 'flex';
    msg.style.background = 'rgba(0,0,0,.35)';
    msg.style.alignItems = 'flex-end';
    msg.innerHTML = '<div style="width:100%">カメラを利用できませんでした（' + e.name + '）。ブラウザのカメラ許可をご確認ください。<br>いまは参考として3Dモデルを回転表示しています。</div>';
    demo();
  }
}

function loop(){
  if (!running) return;
  if (video.currentTime !== lastT) {
    lastT = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    const mats = res.facialTransformationMatrixes;
    if (mats && mats.length) {
      faceMat.fromArray(mats[0].data);
      anchor.matrix.copy(faceMat);
      anchor.visible = true;
    } else {
      anchor.visible = false;
    }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

function demo(){
  resize();
  anchor.visible = true;
  anchor.children.forEach(c => { if (c !== fit) c.visible = false; });
  let t = 0;
  (function spin(){
    t += 0.008;
    const m = new THREE.Matrix4().makeRotationY(t);
    m.setPosition(0, -2.5, -30);
    anchor.matrix.copy(m);
    renderer.render(scene, camera);
    requestAnimationFrame(spin);
  })();
}
start();
</script>
</body>
</html>
